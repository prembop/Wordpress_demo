name: wordpress_demo

services:
  mysql:
    image: mysql:8.0
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: Root@123
      MYSQL_DATABASE: wordpress
      MYSQL_USER: wpuser
      MYSQL_PASSWORD: Wp@123

    volumes:
      - mysql_data:/var/lib/mysql

    networks:
      - wordpress-net

  wordpress:
    image: wordpress:latest
    restart: always

    ports:
      - "8081:80"

    environment:
      WORDPRESS_DB_HOST: mysql
      WORDPRESS_DB_USER: wpuser
      WORDPRESS_DB_PASSWORD: Wp@123
      WORDPRESS_DB_NAME: wordpress

    depends_on:
      - mysql

    volumes:
      - wordpress_data:/var/www/html

    networks:
      - wordpress-net

volumes:
  mysql_data:
  wordpress_data:

networks:
  wordpress-net:
